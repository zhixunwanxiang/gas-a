[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-a-lifecycle"
version = "1.0.0"
description = "A-task gas classifier drift monitoring and controlled continual training"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
gas-a = "gas_a.cli:main"

[project.optional-dependencies]
live = ["swanlab==0.10.5"]

[tool.setuptools.packages.find]
where = ["src"]

